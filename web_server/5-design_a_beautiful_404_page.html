<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 - Ceci n'est pas une page</title>
  <style>
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      background: #ece3cf;
      color: #2b2620;
      font-family: Georgia, "Times New Roman", serif;
      text-align: center;
    }
    .frame {
      width: 100%;
      max-width: 520px;
      padding: 3rem 2rem;
      background: #f8f3e6;
      border: 14px solid #6b4f2e;
      box-shadow: 0 0 0 4px #c9a96e, 0 24px 48px rgba(0, 0, 0, 0.25);
    }
    .code {
      font-size: 6rem;
      font-style: italic;
      line-height: 1;
    }
    .caption {
      margin: 1.2rem 0 1.5rem;
      font-size: 1.6rem;
      font-style: italic;
    }
    .note {
      font-family: Arial, sans-serif;
      font-size: 0.95rem;
      color: #5a5146;
    }
    .plate {
      margin-top: 2rem;
      padding: 0.6rem 1.2rem;
      background: #2b2620;
      color: #e8dcc0;
      font-size: 0.85rem;
      letter-spacing: 0.04em;
    }
    a {
      margin-top: 1.5rem;
      color: #6b4f2e;
      font-family: Arial, sans-serif;
      text-decoration: none;
      border-bottom: 1px solid #6b4f2e;
    }
    a:hover { color: #2b2620; border-color: #2b2620; }
  </style>
</head>
<body>
  <div class="frame">
    <div class="code">404</div>
    <p class="caption">Ceci n'est pas une page.</p>
    <p class="note">The page you are looking for was moved, removed, or never existed.</p>
  </div>
  <div class="plate"><em>La Trahison des URLs</em> &mdash; after Magritte, 2026</div>
  <a href="/">Back to the gallery entrance</a>
</body>
</html>
